; Seeed XIAO ESP32-C3 — SwitchBot BLE bridge → UART → Tab5 (M5-Bus G6/G7)
;
; Build z kořene (Project Tasks):  pio run -e xiao-esp32c3-bridge
; Build z této složky:             pio run
; Upload:                          pio run -t upload
; Monitor:                         pio device monitor
;
; UART k Tab5 (115200):
;   Xiao D6 (TX, GPIO21) → Tab5 G7 (RX)
;   Xiao D7 (RX, GPIO20) ← Tab5 G6 (TX)
;   GND společná
; USB Type-C = native USB CDC (Serial), UART na Serial1.
; Xiao nemá uživatelskou LED — volitelně externí LED na D10 (viz env devkit).

[platformio]
default_envs = xiao-esp32c3-bridge

[env:xiao-esp32c3-bridge]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = seeed_xiao_esp32c3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DBRIDGE_TX_PIN=21
  -DBRIDGE_RX_PIN=20
  -DUART_BAUD=115200
  -DSTATUS_LED_PIN=-1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -I$PROJECT_DIR/../include

lib_deps =
  h2zero/NimBLE-Arduino@^2.2.3

lib_ldf_mode = deep

; ESP32-C3 DevKit / SuperMini (WS2812 na GPIO8) — zpětná kompatibilita
[env:esp32-c3-bridge]
extends = env:xiao-esp32c3-bridge
board = esp32-c3-devkitm-1
build_flags =
  ${env:xiao-esp32c3-bridge.build_flags}
  -DSTATUS_LED_PIN=8

; starý název env
[env:esp32-h2-bridge]
extends = env:xiao-esp32c3-bridge

; OTA upload po spuštění Wi‑Fi z Tab5 (tlačítko OTA v Nastavení)
;   pio run -e xiao-esp32c3-ota -t upload --upload-port <IP bridge>
[env:xiao-esp32c3-ota]
extends = env:xiao-esp32c3-bridge
upload_protocol = espota
upload_port = 192.168.50.250
upload_flags =
  --port=3232
  --timeout=120
