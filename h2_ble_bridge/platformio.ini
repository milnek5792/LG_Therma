; ESP32-C3 — SwitchBot BLE bridge → UART → Tab5 (M5-Bus G6/G7)
;
; Build z kořene (Project Tasks):  pio run -e esp32-c3-bridge
; Build z této složky:             pio run
; Upload:                          pio run -e esp32-c3-bridge -t upload
; Monitor:                         pio device monitor -e esp32-c3-bridge
;
; UART k Tab5 (115200):
;   C3 TX GPIO21 → Tab5 G7 (RX)
;   C3 RX GPIO20 ← Tab5 G6 (TX)
;   GND společná
; USB Type-C = native USB CDC (Serial), UART na Serial1.

[platformio]
default_envs = esp32-c3-bridge

[env:esp32-c3-bridge]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DBRIDGE_TX_PIN=21
  -DBRIDGE_RX_PIN=20
  -DUART_BAUD=115200
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

lib_deps =
  h2zero/NimBLE-Arduino@^2.2.3

lib_ldf_mode = deep

; zpětná kompatibilita starého názvu env
[env:esp32-h2-bridge]
extends = env:esp32-c3-bridge
