; LG Therma — M5Stack Tab5 (ESP32-P4) + volitelně Waveshare 7B
; Platform: pioarduino (Arduino framework pro ESP32-P4)
;
; Tab5 build:  pio run -e m5stack-tab5-p4
; Upload USB:  pio run -e m5stack-tab5-p4 -t upload
; Upload OTA:  pio run -e m5stack-tab5-ota -t upload --upload-port <IP>
; Monitor:      pio device monitor -e m5stack-tab5-p4
;
; Po prvním stažení knihoven spusť patch LVGL (nebo rebuild — pre-script):
;   scripts/patch_lvgl_tab5.py

[platformio]
default_envs = m5stack-tab5-p4
src_dir = src
include_dir = include
boards_dir = boards
lib_dir = lib
data_dir = data

; ---------------------------------------------------------------------------
; M5Stack Tab5 — ESP32-P4 + ESP32-C6 (Wi-Fi SDIO), 1280×720, H2 UART pokoj
; ---------------------------------------------------------------------------
[env:m5stack-tab5-p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = m5stack-tab5-p4
framework = arduino

board_build.variants_dir = variants
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

extra_scripts =
  pre:scripts/gen_build_stamp.py
  pre:scripts/patch_lvgl_tab5.py

build_flags =
  -DLG_BOARD_TAB5=1
  -DLG_USE_EEZ_LVGL=1
  -DLV_CONF_INCLUDE_SIMPLE
  -DBOARD_HAS_PSRAM
  -DCONFIG_ESP_BROWNOUT_DET=0
  -DCONFIG_ESP_BROWNOUT_USE_INTR=0
  -DCONFIG_ARDUINO_LOOP_STACK_SIZE=65536
  -DCORE_DEBUG_LEVEL=3
  -I$PROJECT_INCLUDE_DIR
  -I$PROJECT_DIR

build_src_filter =
  +<*>
  -<ui_ui_bindings.cpp>

lib_deps =
  https://github.com/M5Stack/M5Unified.git
  https://github.com/M5Stack/M5GFX.git
  lvgl/lvgl@9.2.2
  knolleary/PubSubClient@2.8

lib_ldf_mode = deep

; ---------------------------------------------------------------------------
; Wi‑Fi OTA z PlatformIO (ArduinoOTA / espota) — Tab5 musí být na Wi‑Fi
;   pio run -e m5stack-tab5-ota -t upload --upload-port 192.168.x.x
; Hostname: lgtherma-tab5 (viz ota_config.h)
; ---------------------------------------------------------------------------
[env:m5stack-tab5-ota]
extends = env:m5stack-tab5-p4
upload_protocol = espota
; IP Tab5 (Nastavení / router). Změň tady, když se IP změní.
upload_port = 192.168.50.249
; Board JSON má require_upload_port=true (USB) — pro espota vypnout:
board_upload.require_upload_port = false
upload_flags =
  --port=3232
  --timeout=60
extra_scripts =
  pre:scripts/gen_build_stamp.py
  pre:scripts/patch_lvgl_tab5.py
  pre:scripts/force_ota_upload_port.py

; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-Touch-LCD-7B (1024×600) — vyžaduje src/board/ z LG_Therma_7B
; ---------------------------------------------------------------------------
[env:waveshare-s3-7b]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

extra_scripts =
  pre:scripts/gen_build_stamp.py

build_flags =
  -DLG_BOARD_7B=1
  -DLG_USE_EEZ_LVGL=1
  -DLV_CONF_INCLUDE_SIMPLE
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  -I ${PROJECT_DIR}
  -I ${PROJECT_DIR}/src/board

build_src_filter =
  +<*>
  -<ui_ui_bindings.cpp>

lib_deps =
  lvgl/lvgl@9.2.2
  knolleary/PubSubClient@2.8
  h2zero/NimBLE-Arduino@^2.1.0

lib_ldf_mode = deep

; ---------------------------------------------------------------------------
; ESP32-C3 — SwitchBot BLE bridge → UART → Tab5 (M5-Bus G6/G7)
; Build/upload i z Project Tasks (stejné jako pio run --project-dir h2_ble_bridge)
; UART: C3 TX=21 → Tab5 G7, C3 RX=20 ← Tab5 G6
; ---------------------------------------------------------------------------
[env:esp32-c3-bridge]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

build_src_filter =
  -<*>
  +<../h2_ble_bridge/src/*>

monitor_speed = 115200
upload_speed = 921600

build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DBRIDGE_TX_PIN=21
  -DBRIDGE_RX_PIN=20
  -DUART_BAUD=115200
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

lib_deps =
  h2zero/NimBLE-Arduino@^2.2.3

lib_ldf_mode = deep

[env:esp32-h2-bridge]
extends = env:esp32-c3-bridge
