; LG Therma — Waveshare ESP32-S3-Touch-LCD-7B (1024×600)
; Platform: pioarduino (Arduino framework)

[platformio]
default_envs = waveshare-s3-7b
src_dir = src
include_dir = include

[env:waveshare-s3-7b]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L

monitor_speed = 115200
; Native USB CDC (COM číslo skáče). Po flashi: zavři monitor → RESET → otevři znovu.
; "SetCommTimeouts error 22" = Windows/CDC port zrovna není ready — není chyba firmware.
monitor_port = COM10
monitor_filters = esp32_exception_decoder
monitor_rts = 0
monitor_dtr = 0
; Upload = CH343 (USB-C "UART", DIP UART1). LIN = DIP UART2 + monitor na USB CDC.
upload_port = COM9
upload_speed = 921600

board_upload.flash_mode = qio

build_flags =
  ; MODE=1 = HW USB-Serial/JTAG CDC (Serial = HWCDC) — stabilnější než TinyUSB
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  -DLV_CONF_INCLUDE_SIMPLE
  -DLG_THERMA_7B=1
  -DLG_THERMA_ENABLE_TOUCH=1
  -DLG_THERMA_SIMPLE_UI=0
  -DLG_THERMA_UI_SCALE=0
  -DLG_THERMA_BOOT_SETTINGS=0
  -DLG_THERMA_BLE_ROOM=1
  -I include
  -I src/board
  -I src/ui
  -I src/net
  -I src/bus
  -I src/stubs
  -Wl,--wrap=esp_mbedtls_mem_calloc
  -Wl,--wrap=esp_mbedtls_mem_free

; 1) Upload: kabel UART, DIP UART1, COM9 (CH343)
; 2) LIN + monitor: DIP UART2, kabel USB → COM10, monitor_dtr/rts=0
; 3) Po flashi otevři monitor na COM10 a případně zmáčkni RESET

build_src_filter =
  +<*>
  -<board/lvgl_port.*>

lib_deps =
  lvgl/lvgl@9.2.2
  knolleary/PubSubClient@2.8
  h2zero/NimBLE-Arduino@^2.1.0

lib_ldf_mode = deep
