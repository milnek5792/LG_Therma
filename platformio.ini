; LG Therma — Waveshare ESP32-S3-Touch-LCD-7B (1024×600)
; Platform: pioarduino (Arduino framework)

[platformio]
default_envs = waveshare-s3-7b
src_dir = src
include_dir = include

[env:waveshare-s3-7b]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
; N16R8 = 16MB flash + 8MB OPI PSRAM (ne plain esp32-s3-devkitc-1 = bez PSRAM!)
board = esp32-s3-devkitc1-n16r8
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; CH343 = USB-C "UART" (teď COM9). Tím vždy flashuj — bez BOOT chaosu.
upload_port = COM9
upload_speed = 921600
; Monitor: buď stejný COM9 (DIP=UART1, logy na UART0), nebo druhý kabel do "USB".
; monitor_port necháme auto — COM čísla Windows mění.

; Vynutit QIO při flash (boot log nesmí zůstat jen na DIO bez PSRAM)
board_upload.flash_mode = qio

build_flags =
  ; Serial = TinyUSB (USB-C "USB"). Serial0 = UART0 → CH343 při DIP UART1.
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  -DLV_CONF_INCLUDE_SIMPLE
  -DLG_THERMA_7B=1
  -DLG_THERMA_ENABLE_TOUCH=1
  -DLG_THERMA_SIMPLE_UI=0
  -DLG_THERMA_UI_SCALE=0
  -DLG_THERMA_BOOT_SETTINGS=0
  -DLG_THERMA_BLE_ROOM=1
  -I include
  -I src/board
  -I src/ui
  -I src/net
  -I src/bus
  -I src/stubs
  -Wl,--wrap=esp_mbedtls_mem_calloc
  -Wl,--wrap=esp_mbedtls_mem_free

; === COM chaos vysvětlený ===
; COM8  = Espressif native USB v download módu (BOOT+RESET) — dočasný, mění se
; COM9  = CH343 (USB-C "UART") — STÁLÝ upload port, používej tenhle
; TinyUSB COM = USB-C "USB" po startu firmwaru — monitor při druhém kabelu
; Pravidlo: UPLOAD vždy CH343 (COM9). BOOT jen nouzově.

build_src_filter =
  +<*>
  -<board/lvgl_port.*>

lib_deps =
  lvgl/lvgl@9.2.2
  knolleary/PubSubClient@2.8
  h2zero/NimBLE-Arduino@^2.1.0

lib_ldf_mode = deep
